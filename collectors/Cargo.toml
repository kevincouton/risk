[package]
name = "risk-collectors"
version = "0.1.0"
edition = "2021"

[dependencies]
chassis = { path = "../service/crates/chassis" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.11", default-features = false, features = ["blocking", "rustls-tls", "json"] }
tracing = "0.1"
tracing-subscriber = "0.3"
hotpath = { version = "0.23", optional = true }

[features]
hotpath = ["dep:hotpath", "hotpath/hotpath"]

[dev-dependencies]
httptest = "0.16"

[[bin]]
name = "ingest"
path = "src/bin/ingest.rs"

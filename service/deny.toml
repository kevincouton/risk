# cargo-deny configuration for the service template workspace.
# Synced to instantiated clones via sync-manifest.txt.

[advisories]
yanked = "deny"
# Accepted risk, still present after the openidconnect 4.0.1 / reqwest 0.12
# upgrade (rustls 0.23 / hyper 1.x / h2 0.4 — the rustls 0.21, webpki 0.101,
# h2 0.3, and rustls-pemfile ignores were cleared by that upgrade).
ignore = [
    # rsa 0.9.10 (via openidconnect 4.0.1, latest 4.x): Marvin timing
    # sidechannel; no upstream fix. Verified via `cargo tree -i rsa`.
    "RUSTSEC-2023-0071",
]

[bans]
multiple-versions = "warn"
wildcards = "warn"
# The topcoat rev pin (see [sources] below) is the single tracked exception to
# the crates.io-only rule; do not add further git sources without a documented
# exception in SECURITY.md.
highlight = "all"

[licenses]
# Repo is proprietary (all rights reserved, see LICENSE); this allow-list covers
# the permissive licenses of third-party dependencies.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "Unicode-3.0",
    "0BSD",
    # webpki-roots 1.x (Mozilla roots bundle, via hyper-rustls 0.27).
    "CDLA-Permissive-2.0",
]
# Workspace crates (chassis, server) are not published anywhere.
private = { ignore = true }

[sources]
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    # Policy exception (see SECURITY.md "Dependency policy"): topcoat is the
    # workspace web framework, rev-pinned for reproducibility
    # (rev 371c7403 = v0.5.0, service/SERVER_SHELL.md R-0). topcoat was not on
    # crates.io when the pin was set; it is now published (0.10.x), so the
    # registry migration / version upgrade is tracked follow-up work. No other
    # git sources are permitted.
    "https://github.com/tokio-rs/topcoat",
]
unknown-registry = "deny"
unknown-git = "deny"

# cargo-deny configuration for the service template workspace.
# Synced to instantiated clones via sync-manifest.txt.

[advisories]
yanked = "deny"
# Accepted risk, still present after the openidconnect 4.0.1 / reqwest 0.12
# upgrade (rustls 0.23 / hyper 1.x / h2 0.4 — the rustls 0.21, webpki 0.101,
# h2 0.3, and rustls-pemfile ignores were cleared by that upgrade).
ignore = [
    # rsa 0.9.10 (via openidconnect 4.0.1, latest 4.x): Marvin timing
    # sidechannel; no upstream fix. Verified via `cargo tree -i rsa`.
    "RUSTSEC-2023-0071",
]

[bans]
multiple-versions = "warn"
wildcards = "warn"
# Git-sourced topcoat (see SERVER_SHELL.md R-0) is a known, tracked exception
# to the crates.io-only rule; do not deny git sources here until the
# vendoring/publishing follow-up lands.
highlight = "all"

[licenses]
# Repo is proprietary (all rights reserved, see LICENSE); this allow-list covers
# the permissive licenses of third-party dependencies.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "Unicode-3.0",
    "0BSD",
    # webpki-roots 1.x (Mozilla roots bundle, via hyper-rustls 0.27).
    "CDLA-Permissive-2.0",
]
# Workspace crates (chassis, server) are not published anywhere.
private = { ignore = true }

[sources]
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Only topcoat remains git-pinned (R-0, service/SERVER_SHELL.md) — a tracked
# exception to the crates.io-only rule until the vendoring/publishing
# follow-up lands. The former stdx rev pins now come from crates.io.
allow-git = [
    "https://github.com/tokio-rs/topcoat",
]
unknown-registry = "deny"
unknown-git = "deny"

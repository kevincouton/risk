[package]
name = "chassis"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
base64 = { git = "https://github.com/rust-stdx/stdx", rev = "c83000f05a084527033e8b884fb21ea07de80ab8" }
constant_time_eq = { git = "https://github.com/rust-stdx/stdx", rev = "c83000f05a084527033e8b884fb21ea07de80ab8" }
dotenvy = "0.15"
hex = "0.4"
hmac = "0.13"
openidconnect = "=4.0.1" # oauth2 5 re-exports reqwest 0.12; its Client implements AsyncHttpClient
rand = "0.9"
# reqwest 0.12 matches openidconnect 4.0.1's oauth2 5 re-export (single reqwest
# in the tree; R-3 coordination note). rustls-tls here also covers the
# openidconnect::reqwest re-export, which oauth2 pulls with no TLS feature.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
sha2 = "0.10"
time = { version = "0.3", features = ["macros", "parsing", "formatting"] }
tokio = { version = "1", features = ["rt", "time"] } # analytics fire-and-forget spawn (server runtime)
tracing = "0.1"

[dev-dependencies]
httptest = "0.16"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

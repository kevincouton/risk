[package]
name = "server"
version = "0.1.0"
edition = "2021"

[lib]
name = "server"
path = "src/lib.rs"

[[bin]]
name = "server"
path = "src/bin/server.rs"

[[bin]]
name = "ingest"
path = "src/bin/ingest.rs"

[[bin]]
name = "score"
path = "src/bin/score.rs"

[dependencies]
chassis = { path = "../chassis" }
topcoat = { workspace = true } # rev-pinned git dep (R-0, SERVER_SHELL.md)
tower = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] } # same version as chassis (R-2)
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2" # query-pair decoding (Go r.URL.Query semantics)
hotpath = { version = "0.23", optional = true }

[features]
# hotpath/hotpath enables the actual profiler; dep:hotpath alone leaves the macros as no-ops.
hotpath = ["dep:hotpath", "hotpath/hotpath"]

[dev-dependencies]
tempfile = "3"
httptest = "0.16"
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls", "blocking", "json"] }
time = { version = "0.3", features = ["macros", "formatting"] }
hex = "0.4"
hmac = "0.12"
sha2 = "0.10"
